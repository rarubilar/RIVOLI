<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>Rivoli Tragos de Verano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: una columna de celular; logo fijo arriba (home), tres umbrales verticales que se abren a pantalla completa. Fondo blanco por decisión del cliente: un solo tema claro. */
:root{
  --bg:#ffffff;
  --ink:#1f262d;      /* pizarra Rivoli */
  --muted:#6b737a;
  --gold:#8a6a32;     /* oliva dorada del logo, AA sobre blanco */
  --gold-soft:#c9b48a;
  --line:#e7e4de;
  --tint:#f7f5f1;     /* mármol muy leve para paneles */
  --f-name:"Instrument Serif","Times New Roman",serif;
  --f-cap:"Cinzel","Trajan Pro",serif;
  --f-body:"Cormorant Garamond","Garamond",Georgia,serif;
  --r:.5rem;
  --hdr:96px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shell{max-width:480px;margin-inline:auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header / home */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:var(--hdr);display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 28px;column-gap:10px;align-items:center}
.hn{display:flex;min-width:0;justify-content:center}
.hn a{font-family:var(--f-name);font-size:2.2rem;line-height:1;display:grid;place-items:center;min-height:44px;min-width:36px}
.hn a span{color:var(--gold)}
.home,.htitle{height:72px;display:flex;align-items:center;justify-content:center;min-width:0}
.home img{height:64px;width:auto;max-width:100%;object-fit:contain;display:block}
.htitle{gap:.45rem;color:var(--ink)}
.htitle .n3{font-family:var(--f-name);font-size:4.4rem;line-height:.72;color:var(--gold);padding-top:.1rem}
.htitle .tx{font-family:var(--f-name);font-size:1.05rem;line-height:1.05;letter-spacing:.01em;white-space:nowrap}
header::after{content:"";position:absolute;left:50%;bottom:0;width:44px;height:1px;background:var(--gold-soft);transform:translateX(-50%)}

/* inicio: tres botones */
#inicio{display:flex;flex-direction:column;gap:10px;padding-block:12px 16px;
  height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:480px}
.door{position:relative;flex:1;min-height:0;border-radius:var(--r);overflow:hidden;display:block;width:100%;text-align:left;background:var(--tint);
  border:1px solid var(--line);transition:opacity .3s,transform .3s}
.door .pic{position:absolute;inset:0;width:100%;height:100%}
.door img.pic{object-fit:cover;object-position:center 48%}
.door .lab{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;
  padding:1.6rem 1rem .75rem;background:linear-gradient(to top,rgba(255,255,255,.95) 40%,rgba(255,255,255,0))}
.door .ro{position:absolute;top:.7rem;left:.9rem;font-family:var(--f-cap);font-size:.72rem;letter-spacing:.3em;color:var(--gold);
  background:rgba(255,255,255,.85);padding:.15rem .45rem;border-radius:3px}
.door .nm{font-family:var(--f-name);font-size:2.1rem;line-height:1;letter-spacing:.01em}
.door .st{display:block;font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:1rem;margin-top:.15rem}
.door .go{font-family:var(--f-name);font-size:2rem;color:var(--gold);line-height:1}
#inicio:has(.door:active) .door:not(:active),#inicio:has(.door:hover) .door:not(:hover){opacity:.4}

/* vista de trago */
.view{padding-block:12px 48px;animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.view.from-r{animation-name:fromR}.view.from-l{animation-name:fromL}
@keyframes fromR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
main{touch-action:pan-y}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-height:58dvh;width:100%;background:var(--tint);border:1px solid var(--line)}
.hero img,.hero svg{width:100%;height:100%;object-fit:cover;display:block}
.title{text-align:center;margin-top:1.4rem;display:grid;gap:.2rem}
.title .ro{font-family:var(--f-cap);font-size:.72rem;letter-spacing:.34em;color:var(--gold)}
.title h1{font-family:var(--f-name);font-weight:400;font-size:clamp(3rem,15vw,4.2rem);line-height:.95;margin:0;letter-spacing:.005em}
.title .alias{font-style:italic;color:var(--muted);font-size:1.15rem}
.orn{display:flex;justify-content:center;margin:1.2rem 0 .2rem;color:var(--gold-soft)}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin-top:1rem}
.facts div{padding:.8rem .3rem;text-align:center;display:grid;gap:.2rem;align-content:start}
.facts div+div{border-left:1px solid var(--line)}
.cap{font-family:var(--f-cap);font-size:.6rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.facts b{font-weight:500;font-size:1.02rem;line-height:1.2}

.blk{margin-top:2rem;display:grid;gap:.8rem}
.blk>.cap{display:flex;align-items:center;gap:.7rem}
.blk>.cap::before,.blk>.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.intro{margin:0 0 .3rem;font-size:1.18rem;line-height:1.45}
.why{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.why li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:.7rem;align-items:center;font-size:1.08rem;line-height:1.3}
.why svg{width:28px;height:28px;color:var(--gold)}

.recipe{display:grid;gap:1.1rem;background:var(--tint);border:1px solid var(--gold-soft);border-radius:var(--r);padding:1.2rem .9rem 1.3rem}
.rblk{margin-top:2.2rem;display:grid;gap:.9rem}
.rhead{font-family:var(--f-name);font-weight:400;font-size:calc(clamp(3rem,15vw,4.2rem) * .85);line-height:1;text-align:center;margin:0}
.rhead+.orn2{display:flex;justify-content:center;color:var(--gold-soft)}
.vsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-top:2rem}
.vsel button{border:1px solid var(--line);border-radius:4px;padding:.95rem .2rem;font-family:var(--f-name);font-size:1.3rem;line-height:1;min-height:52px;transition:background .2s,color .2s,border-color .2s}
.vsel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rtop{display:flex;justify-content:space-between;align-items:center}
.mult{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mult button{font-family:var(--f-cap);font-size:.72rem;letter-spacing:.1em;padding:.45rem .75rem;color:var(--muted);min-width:44px;min-height:36px}
.mult button[aria-pressed="true"]{background:var(--ink);color:#fff}
.serv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem}
.serv div{display:grid;justify-items:center;text-align:center;gap:.2rem;font-size:.86rem;line-height:1.15;color:var(--muted)}
.serv svg{width:34px;height:34px;color:var(--gold)}
.ing{width:100%;border-collapse:collapse;table-layout:fixed}
.ing td{padding:.7rem 0;border-bottom:1px solid var(--line);vertical-align:middle}
.ing td.n{font-size:1.68rem;line-height:1.15;padding-right:.4rem}
.ing td.n small{display:block;font-size:.9rem;color:var(--muted);font-style:italic}
.ing td.oz{font-family:var(--f-name);font-size:1.75rem;line-height:1;white-space:nowrap;text-align:center}
.ing td.oz small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.ing col.c-n{width:46%}.ing col.c-o,.ing col.c-f{width:27%}
.ing td.f .fing{justify-content:flex-end}
.fing{display:flex;align-items:flex-end;gap:2px;height:28px}
.fing i{width:7px;height:24px;border:1px solid var(--gold);border-radius:4px 4px 2px 2px;position:relative;overflow:hidden;display:block}
.fing i::after{content:"";position:absolute;inset:auto 0 0 0;height:var(--f,100%);background:var(--gold)}
.fing em{font-style:normal;font-family:var(--f-cap);font-size:.72rem;color:var(--gold);margin-left:.35rem;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.6rem;counter-reset:s}
.steps li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.4rem;font-size:1.12rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s,upper-roman);font-family:var(--f-cap);font-size:.78rem;color:var(--gold);padding-top:.25rem}
.vars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.var{border:1px solid var(--line);border-radius:var(--r);padding:.8rem;display:grid;gap:.35rem;background:var(--tint)}
.var .vn{font-family:var(--f-name);font-size:1.5rem;line-height:1}
.var .dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem;vertical-align:1px}
.var p{margin:0;font-size:.98rem;line-height:1.3}
.build{margin-top:2.2rem;display:grid;gap:.6rem}
.build>.cap{display:flex;align-items:center;gap:.7rem}
.build>.cap::before,.build>.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.build svg{width:100%;height:auto;display:block}
.note{font-size:.88rem;color:var(--muted);font-style:italic;text-align:center;margin:0}
.next{display:flex;justify-content:space-between;margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1rem}
.next a{font-family:var(--f-name);font-size:1.3rem;color:var(--ink);text-decoration:none;display:flex;gap:.4rem;align-items:center;min-height:44px}
.next a span{color:var(--gold)}
</style>

const BPX=20,BGAP=32,BNX=136,BW=300;
function bFingers(oz,yc){
 const n=oz/DEDO,full=Math.floor(n+1e-6),part=n-full,cnt=Math.min(full+(part>.05?1:0),8);
 let s='',x=BW-38-cnt*9;
 for(let i=0;i<cnt;i++){const f=i<full?1:part,h=16;
  s+=`<rect x="${x}" y="${yc-h/2}" width="6" height="${h}" rx="3" fill="none" stroke="#8a6a32" stroke-width="1"/><rect x="${x}" y="${yc+h/2-h*f}" width="6" height="${h*f}" rx="${f>.9?3:1}" fill="#8a6a32"/>`;x+=9}
 return s+`<text x="${BW}" y="${yc}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="13" fill="#8a6a32">${frac(Math.round(n*3)/3)}</text>`;
}
let bid=0;

   <path d="M22 18 h-8 a7 7 0 0 0 -7 7 v${H*0.45} a7 7 0 0 0 7 7 h11" fill="none" stroke="#1f262d" stroke-width="2"/>

 }else if(kind==='shaker'){

 }else if(kind==='balloon'){

  outline=`M14 -8 C6 ${H*.8} 38 ${bot+10} 64 ${bot+12} C90 ${bot+10} 122 ${H*.8} 114 -8`;foot=50;top=8;rx=116;
  extra=`<path d="M64 ${bot+12} V${bot+44} M42 ${bot+48} H86" stroke="#1f262d" stroke-width="2"/>`;
 }else{
  shape=`M8 0 C10 ${H*.8} 38 ${bot} 64 ${bot} C90 ${bot} 118 ${H*.8} 120 0 Z`;
  outline=`M3 -6 C4 ${H*.9} 36 ${bot+8} 64 ${bot+8} C92 ${bot+8} 124 ${H*.9} 125 -6`;foot=50;top=6;rx=116;
  extra=`<path d="M64 ${bot+8} V${bot+44} M42 ${bot+48} H86" stroke="#1f262d" stroke-width="2"/>`;
 }
 let y=bot,fills='',lines='',mids=[];
 layers.forEach(([nm,oz,col],i)=>{const h=oz*BPX;y-=h;fills+=`<rect x="0" y="${y}" width="130" height="${h}" fill="${col}"/>`;
  if(i<layers.length-1)lines+=`<line x1="0" x2="130" y1="${y}" y2="${y}" stroke="#1f262d" stroke-width="1" stroke-dasharray="3 2"/>`;mids.push(y+h/2)});
 const IP=[[30,26,12],[64,30,-10],[44,52,18],[74,56,0],[24,58,0],[54,80,-14],[84,84,8]];
 const iceSvg=ice?`<g fill="#fff" fill-opacity=".5" stroke="#b9c6cc" stroke-width="1">${IP.slice(0,ice).map(([x,d,r])=>`<rect x="${x}" y="${bot-d-22}" width="22" height="22" rx="3" transform="rotate(${r} ${x+11} ${bot-d-11})"/>`).join('')}</g>`:'';
 return {svg:`<defs><clipPath id="${id}"><path d="${shape}"/></clipPath></defs><g clip-path="url(#${id})">${fills}${lines}${iceSvg}</g><path d="${outline}" fill="none" stroke="#1f262d" stroke-width="2"/>${extra}`,H,foot,top,mids,fillTop:bot-tot*BPX,bot,rx};

function bBlock(kind,layers,Y,s,ice,inline){
 const v=bVessel(kind,layers,ice),n=layers.length,LH=(n-1)*BGAP;
 const vTop=s*v.top,vSpan=vTop+s*(v.H+v.foot);
 const span=inline?vSpan:Math.max(vSpan,LH+20);
 const ty=Y+(span-vSpan)/2+vTop,tx=(120-120*s)/2+12,cy=ty+s*(v.fillTop+v.bot)/2;
 let lt=Math.max(Y+10,cy-LH/2);if(lt+LH>Y+span-10)lt=Y+span-10-LH;
 let out=`<g transform="translate(${tx} ${ty}) scale(${s})">${v.svg}</g>`;
 let maxLy=0;const iy=[];layers.forEach((l,i)=>{let y=ty+s*v.mids[i];if(i&&y>iy[i-1]-30)y=iy[i-1]-30;iy.push(y)});

  const my=ty+s*v.mids[i],mx=tx+s*v.rx,ly=inline?iy[i]:lt+(n-1-i)*BGAP;
  const lead=`<line x1="${mx}" y1="${my}" x2="${BNX-8}" y2="${ly}" stroke="#c9b48a" stroke-width=".9"/>`;

 });
 return {out,end:Y+span,maxLy};
}
function iceRow(y,n){

  <text x="${BNX}" y="${y}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-size="19" fill="${n?'#1f262d':'#8a8f94'}" ${n?'':'font-style="italic"'}>${n?'Hielo':'Sin hielo'}</text>`;
 if(n){let x=BW-38-n*9;for(let i=0;i<n;i++){s+=`<rect x="${x}" y="${y-4}" width="7" height="7" rx="1.5" fill="#fff" stroke="#8aa3ad" stroke-width="1.2" transform="rotate(${i%2?8:-8} ${x+3.5} ${y-.5})"/>`;x+=9}

function buildSVG(id,k){
 if(!BUILD[id])return '';
 const b=BUILD[id](k),tool=b.tool==='jug'?'JUGUERA':'COCTELERA';

 const a=bBlock(b.tool,b.v,30,.65,b.vIce,false);out+=a.out;
 {const iy=Math.max(a.maxLy+34,a.end-6);out+=iceRow(iy,b.vIce);a.end=iy+16;}
 let y=a.end+22;out+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=18;
 out+=`<line x1="64" y1="${y}" x2="64" y2="${y+34}" stroke="#8a6a32" stroke-width="1.4"/><path d="M58 ${y+28} L64 ${y+36} L70 ${y+28}" fill="none" stroke="#8a6a32" stroke-width="1.4"/>
  <text font-family="'Instrument Serif',serif" font-style="italic" font-size="16" fill="#6b737a"><tspan x="${BNX}" y="${y+13}">${b.how[0]}</tspan><tspan x="${BNX}" dy="19">${b.how[1]}</tspan></text>`;
 y+=56;out+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=28;
 out+=`<text x="0" y="${y}" font-family="Cinzel,serif" font-size="11" letter-spacing="2.5" fill="#8a6a32">II · EN LA COPA</text>`;

 {const iy=c.maxLy+36;out+=iceRow(iy,b.ice);c.end=Math.max(c.end,iy+16);}
 return `<section class="build" aria-label="Cómo se arma"><span class="cap">Cómo se arma · 1 trago</span><svg viewBox="0 0 ${BW} ${c.end+6}" role="img" aria-label="Diagrama: ingredientes en la ${tool.toLowerCase()} y capas en la copa, en dedos">${out}</svg></section>`;
}

const ozTxt=x=>{const w=Math.floor(x+1e-6),f=+(x-w).toFixed(3);const m={0.25:'¼',0.5:'½',0.75:'¾'};return ((w?w:'')+(m[f]||''))||'0'};
const frac=x=>{const w=Math.floor(x+1e-6),f=x-w;let s='';if(Math.abs(f-1/3)<.05)s='⅓';else if(Math.abs(f-2/3)<.05)s='⅔';return (w?w:'')+(s||(w?'':'0'))};
function fingers(oz){
  const n=oz/DEDO,full=Math.floor(n+1e-6),part=n-full;let s='';
  for(let i=0;i<Math.min(full,8);i++)s+='<i></i>';
  if(part>.05&&full<8)s+=`<i style="--f:${Math.round(part*100)}%"></i>`;
  const t=frac(Math.round(n*3)/3);
  return `<span class="fing" aria-label="unos ${t} dedos">${s}<em>${t}</em></span>`;
}

  document.getElementById('hNext').innerHTML=`<a href="#${next.id}" aria-label="Siguiente: ${next.name}"><span>›</span></a>`;
  app.querySelectorAll('.vsel button').forEach(b=>b.addEventListener('click',()=>{vsel=+b.dataset.v;const y=scrollY;renderDrink(i);scrollTo(0,y);app.querySelector(`.vsel button[data-v="${vsel}"]`).focus()}));
  app.querySelectorAll('.mult button').forEach(b=>b.addEventListener('click',()=>{mult=+b.dataset.m;const y=scrollY;renderDrink(i);scrollTo(0,y);app.querySelector(`.mult button[data-m="${mult}"]`).focus()}));
}

function route(){
  const id=location.hash.slice(1);
  const i=D.findIndex(d=>d.id===id);
  mult=1;vsel=1;curIdx=i;
  if(i<0)renderHome();else renderDrink(i);
  slideDir=0;
  scrollTo(0,0);
}
function go(step){ if(curIdx<0)return; slideDir=step; location.hash=D[(curIdx+step+D.length)%D.length].id; }
document.getElementById('hPrev').addEventListener('click',()=>{slideDir=-1});
document.getElementById('hNext').addEventListener('click',()=>{slideDir=1});
let tx=0,ty=0,tt=0;
app.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
app.addEventListener('touchend',e=>{
  if(curIdx<0)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-tt<800) go(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
window.addEventListener('hashchange',route);
route();
})();
</script>

</body>
</html>
