<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3c99b">
<title>Rivoli · Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: portada ilustrada a pantalla completa → índice en arcos → sección con categorías deslizables. Fondo blanco, un solo tema claro. */
:root{
  --bg:#ffffff; --ink:#1f262d; --muted:#6b737a; --gold:#8a6a32; --gold-soft:#c9b48a;
  --line:#e7e4de; --tint:#faf7f1; --sand:#e7cf9f;
  --f-name:"Instrument Serif","Times New Roman",serif;
  --f-cap:"Cinzel","Trajan Pro",serif;
  --f-body:"Cormorant Garamond",Garamond,Georgia,serif;
  --r:.5rem; color-scheme:light;
  /* Escala de espacios (8 pt): s1 4 · s2 8 · s3 16 · s4 24 · s5 32 · s6 48. --m = margen lateral */
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--m:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Portada ---------- */
#portada{position:fixed;inset:0;background:#e9d8b4 url("../assets/ilustraciones/portada-massimo.jpg?v=3") center/cover no-repeat}
#portada::before{content:"";position:absolute;inset:0 0 auto 0;height:calc(150px + env(safe-area-inset-top,0px));background:linear-gradient(to bottom,var(--sand) 45%,rgba(227,201,155,0))}
#portada .logo{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--s5) + env(safe-area-inset-top,0px));height:64px;width:auto;z-index:1}
#portada .ctas{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(56px + env(safe-area-inset-bottom,0px));
  display:flex;gap:var(--s2);align-items:stretch;z-index:1}
#portada .cta{width:160px;height:44px;display:grid;place-items:center;font-family:var(--f-name);font-size:24px;letter-spacing:.02em;
  background:#fff;color:var(--gold);border-radius:6px;box-shadow:0 0 0 1px #c9a96e inset, 0 6px 18px rgba(31,38,45,.25);transition:transform .2s}
#portada .tres{height:44px;padding:0 12px 0 var(--s2);display:flex;align-items:center;gap:var(--s2);background:#fff;color:var(--ink);border-radius:6px;
  box-shadow:0 0 0 1px #c9a96e inset, 0 6px 18px rgba(31,38,45,.25);transition:transform .2s;white-space:nowrap}
#portada .tres .n3{font-family:var(--f-name);font-size:44px;line-height:.72;color:var(--gold);padding-top:2px}
#portada .tres .tx{font-family:var(--f-name);font-size:12px;line-height:1.02;letter-spacing:.01em}
#portada .cta:active,#portada .tres:active{transform:scale(.97)}

/* ---------- Vistas interiores ---------- */
.shell{max-width:480px;margin-inline:auto;min-height:100%;
  padding-left:max(var(--m),env(safe-area-inset-left,0px));padding-right:max(var(--m),env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:64px;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid #eee9e0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header .back{font-family:var(--f-name);font-size:2rem;color:var(--gold);display:grid;place-items:center;min-height:44px}
header .home{display:grid;place-items:center}
header .home img{height:40px;width:auto}
header .hlupa{display:grid;place-items:center;width:44px;height:44px;color:var(--gold)}
header .hlupa svg{width:22px;height:22px}
main{padding-block:var(--s4) var(--s6)}
.view{animation:rise .4s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cap{font-family:var(--f-cap);font-size:.68rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.h{font-family:var(--f-name);font-weight:400;font-size:2.6rem;line-height:1;margin:0}
.intro{text-align:center;display:grid;gap:var(--s2);margin-bottom:var(--s3)}
.intro .icono{width:22px;height:auto;justify-self:center;margin:0}
/* sello: Recetas · águila · N tragos, un paso más chico que el rótulo normal */
.sello{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--s3);margin-bottom:calc(var(--s1) - var(--s2))}
.sello .cap{font-size:.5rem;letter-spacing:.26em;margin-right:-.26em}
.sello .cap:first-child{justify-self:end}.sello .cap:last-child{justify-self:start}
.sello .icono{width:14px}
.buscar{display:grid;justify-items:center;margin:0 0 var(--s3)}
.lupa{width:44px;height:44px;display:grid;place-items:center;color:var(--gold);transition:opacity .2s}
.lupa svg{width:24px;height:24px}
.lupa[aria-expanded="true"]{opacity:.55}
.caja{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s}
.caja.on{max-height:72px;opacity:1;margin-top:var(--s2)}
.caja label{display:flex;align-items:center;gap:var(--s2);border-bottom:1px solid var(--gold);padding:var(--s2) var(--s1)}
.caja svg{width:16px;height:16px;color:var(--gold);flex:none}
.caja input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--f-name);font-size:1.35rem;color:var(--ink);padding:0}
.caja input::placeholder{color:#b8bcc0}
.caja input::-webkit-search-cancel-button,.caja input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.caja .x{font-size:1.3rem;color:#a39a8a;width:44px;height:44px;margin:-10px -12px -10px 0;display:grid;place-items:center}
.row mark{background:linear-gradient(transparent 58%,#f1e3c4 58%);color:inherit}
.row .cat{font-family:var(--f-cap);font-size:.58rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:var(--s1)}
.cats.dim{opacity:.35}
.nada{text-align:center;color:#8a8f94;font-style:italic;padding:var(--s4) 0}
.intro p{margin:.6rem auto 0;font-size:1.05rem;color:#58616a;max-width:39ch;line-height:1.4}

/* buscador del recetario */
.bhero{position:relative;display:grid;justify-items:center;gap:var(--s3);text-align:center;padding:var(--s4) 0 0;margin-bottom:var(--s5)}
.bhero .marco{display:grid;grid-template-columns:38px minmax(0,auto) 38px;align-items:center;gap:var(--s3);justify-content:center}
.bhero .laurel{width:38px;height:104px;color:var(--gold);opacity:.75;pointer-events:none}
.bhero .laurel.r{transform:scaleX(-1)}
.bhero .q{font-family:var(--f-name);font-weight:400;font-size:2rem;line-height:1.05;margin:0;max-width:15ch;text-wrap:balance}
.bzona{justify-self:stretch;display:grid;justify-items:center;min-height:56px;align-items:center}
.blupa{width:48px;height:48px;display:grid;place-items:center;color:var(--gold);transition:opacity .2s,transform .3s}
.blupa svg{width:30px;height:30px}
.blupa:active{transform:scale(.92)}
.bcaja{grid-area:1/1;width:44px;height:56px;opacity:0;pointer-events:none;border:1px solid var(--gold);border-radius:999px;background:#fff;box-shadow:0 6px 22px rgba(138,106,50,.16);
  transition:width .45s cubic-bezier(.3,.7,.2,1),opacity .25s;display:flex;align-items:center;padding:0 var(--s4);overflow:hidden}
.bzona .blupa{grid-area:1/1}
.bcaja input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--f-name);font-size:1.45rem;color:var(--ink);padding:0;caret-color:var(--gold)}
.bcaja input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.buscando .bcaja{width:100%;opacity:1;pointer-events:auto}
.buscando .blupa{opacity:0;pointer-events:none}
.rec{transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .22s ease-out;will-change:transform}
#vrec:not(.buscando) .bhero{display:none}
.buscando .bhero{animation:rise .3s ease}
.buscando .rec{transform:translateY(45vh);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s ease}
.rec.arrastre{transition:none!important}
.rec.fuera{display:none}
.buscando .bhero{margin-bottom:var(--s3)}
#bres{display:none}
.buscando #bres{display:block;padding-bottom:96px}
#bres .row{color:inherit}
.bvolver{position:fixed;left:50%;bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;display:grid;justify-items:center;gap:var(--s1);
  font-family:var(--f-cap);font-size:.6rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;background:rgba(255,255,255,.92);padding:var(--s2) var(--s3);border-radius:999px;transition:opacity .3s,transform .3s;z-index:15;min-height:44px}
.bvolver::before{content:"";width:10px;height:10px;border-left:1.5px solid var(--gold);border-top:1.5px solid var(--gold);transform:rotate(45deg);animation:sube 1.6s ease-in-out infinite}
@keyframes sube{50%{transform:translateY(-4px) rotate(45deg)}}
.buscando .bvolver{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* tarjetas de trago: texto sobre blanco a la izquierda, la escena del trago aparece hacia la derecha */
.tarjs{display:grid;gap:var(--s3);margin-top:var(--s4)}
.tarj{position:relative;display:block;height:128px;border:1px solid #ece3d1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(31,38,45,.05);transition:transform .2s,border-color .2s}
.tarj:active{transform:scale(.985);border-color:var(--gold-soft)}
.tarj .foto{position:absolute;top:0;bottom:0;right:calc(-1 * var(--s3));width:66%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 22%,#000 50%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 22%,#000 50%)}
.tarj.sin .foto{display:grid;place-items:center;background:linear-gradient(90deg,#fff 0%,#f6f0e4 55%,#efe5d2 100%)}
.tarj.sin .foto svg{width:46px;height:46px;color:var(--gold-soft);margin-left:30%}
.tarj .tx{position:relative;z-index:1;height:100%;width:57%;padding:var(--s3) 0 var(--s3) var(--s3);display:flex;flex-direction:column;justify-content:center;gap:var(--s1)}
.tarj .cat{font-family:var(--f-cap);font-size:.58rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.tarj .n{font-family:var(--f-name);font-size:1.45rem;line-height:1;text-wrap:balance}
.tarj small{font-size:.9rem;color:#7d848a;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarj .top{display:flex;gap:var(--s2);align-items:baseline;white-space:nowrap}
.tarj .top .pend{font-size:.5rem}
.tarj .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarj.largo small{-webkit-line-clamp:1}

/* ficha de trago (mismo diseño que los 3 tragos nuevos) */
.trago .hero{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-height:58dvh;width:100%;background:var(--tint);border:1px solid var(--line)}
.trago .hero img,.trago .hero svg{width:100%;height:100%;object-fit:cover;display:block}
.trago .title{text-align:center;margin-top:var(--s4);display:grid;gap:var(--s2)}
.trago .title .ro{font-family:var(--f-cap);font-size:.72rem;letter-spacing:.34em;color:var(--gold)}
.trago .title h1{font-family:var(--f-name);font-weight:400;font-size:clamp(3rem,15vw,4.2rem);line-height:.95;margin:0;letter-spacing:.005em}
.trago .title .alias{font-style:italic;color:var(--muted);font-size:1.15rem}
.trago .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin-top:var(--s3)}
.trago .facts div{padding:var(--s3) var(--s1);text-align:center;display:grid;gap:var(--s1);align-content:start}
.trago .facts div+div{border-left:1px solid var(--line)}
.trago .cap{font-family:var(--f-cap);font-size:.6rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.trago .facts b{font-weight:500;font-size:1.02rem;line-height:1.2}
.trago .blk{margin-top:var(--s5);display:grid;gap:var(--s3)}
.trago .blk>.cap{display:flex;align-items:center;gap:var(--s3)}
.trago .blk>.cap::before,.trago .blk>.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.trago .tintro{margin:0;font-size:1.18rem;line-height:1.45}
.trago .why{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.trago .why li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--s3);align-items:center;font-size:1.08rem;line-height:1.3}
.trago .why svg{width:28px;height:28px;color:var(--gold)}
.trago .recipe{display:grid;gap:var(--s4);background:var(--tint);border:1px solid var(--gold-soft);border-radius:var(--r);padding:var(--s4) var(--s3)}
.trago .rblk{margin-top:var(--s6);display:grid;gap:var(--s3)}
.trago .rhead{font-family:var(--f-name);font-weight:400;font-size:calc(clamp(3rem,15vw,4.2rem) * .85);line-height:1;text-align:center;margin:0}
.trago .rtop{display:flex;justify-content:space-between;align-items:center}
.trago .mult{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trago .mult button{font-family:var(--f-cap);font-size:.72rem;letter-spacing:.1em;padding:var(--s2) 12px;color:var(--muted);min-width:44px;min-height:44px}
.trago .mult button[aria-pressed="true"]{background:var(--ink);color:#fff}
.trago .serv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.trago .serv div{display:grid;justify-items:center;text-align:center;gap:var(--s1);font-size:.86rem;line-height:1.15;color:var(--muted)}
.trago .serv svg{width:34px;height:34px;color:var(--gold)}
.trago .ing{width:100%;border-collapse:collapse;table-layout:fixed}
.trago .ing td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.trago .ing td.n{font-size:1.68rem;line-height:1.15;padding-right:var(--s2)}
.trago .ing td.n small{display:block;font-size:.9rem;color:var(--muted);font-style:italic}
.trago .ing td.oz{font-family:var(--f-name);font-size:1.75rem;line-height:1;white-space:nowrap;text-align:center}
.trago .ing td.oz small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.trago .ing col.c-n{width:46%}.trago .ing col.c-o,.trago .ing col.c-f{width:27%}
.trago .ing td.f .fing{justify-content:flex-end}
.trago .fing{display:flex;align-items:flex-end;gap:2px;height:28px}
.trago .fing i{width:7px;height:24px;border:1px solid var(--gold);border-radius:4px 4px 2px 2px;position:relative;overflow:hidden;display:block}
.trago .fing i::after{content:"";position:absolute;inset:auto 0 0 0;height:var(--f,100%);background:var(--gold)}
.trago .fing em{font-style:normal;font-family:var(--f-cap);font-size:.72rem;color:var(--gold);margin-left:var(--s1);white-space:nowrap}
.trago .steps{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2);counter-reset:s}
.trago .steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--s2);font-size:1.12rem;line-height:1.35;counter-increment:s}
.trago .steps li::before{content:counter(s,upper-roman);font-family:var(--f-cap);font-size:.78rem;color:var(--gold);padding-top:var(--s1)}
.trago .note{font-size:.88rem;color:var(--muted);font-style:italic;text-align:center;margin:0}
.trago .qty{font-family:var(--f-name);font-size:1.6rem;line-height:1;white-space:nowrap;text-align:right}
.trago .qty small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-top:var(--s1)}
.trago .qty.pd{font-family:var(--f-cap);font-size:.6rem;letter-spacing:.14em;color:#a39a8a}
.trago .ing col.c-n{width:62%}.trago .ing col.c-q{width:38%}
.trago .hero{margin-top:0}
.trago .build{margin-top:var(--s5);display:grid;gap:var(--s3)}
.trago .build>.cap{display:flex;align-items:center;gap:var(--s3)}
.trago .build>.cap::before,.trago .build>.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.trago .build svg{width:100%;height:auto;display:block}
.trago .qty .qx{display:block;font-family:var(--f-cap);font-style:normal;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);line-height:1.6}
.trago .vsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s4)}
.trago .vsel button{border:1px solid var(--line);border-radius:4px;padding:var(--s3) var(--s1);font-family:var(--f-name);font-size:1.2rem;line-height:1.05;min-height:56px;transition:background .2s,color .2s,border-color .2s}
.trago .vsel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.trago .pendr{border:1px dashed var(--gold-soft);border-radius:var(--r);padding:var(--s4) var(--s3);text-align:center;display:grid;gap:var(--s2)}
.trago .pendr p{margin:0;color:var(--muted);font-style:italic}
.trago .serv{grid-template-columns:repeat(3,minmax(0,1fr))}
.trago .title h1{position:relative;display:inline-block;justify-self:center;font-size:clamp(2.2rem,10.5vw,2.9rem)!important}
.trago .rtop.sut{justify-content:flex-end;gap:var(--s2);margin:calc(-1*var(--s2)) 0 calc(-1*var(--s2))}
.trago .rtop.sut .cap{font-size:.55rem;color:var(--muted)}
.trago .rtop.sut .mult{border:0;border-radius:0;gap:0}
.trago .rtop.sut .mult button{min-width:36px;min-height:40px;padding:0 var(--s1);font-size:.62rem;color:#a39a8a;background:none;border-bottom:1px solid transparent}
.trago .rtop.sut .mult button[aria-pressed="true"]{background:none;color:var(--ink);border-bottom-color:var(--gold)}
.trago .title .corona{position:absolute;top:-2px;right:-22px;width:20px;height:20px;color:var(--gold);opacity:.85}
.trago .badge{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin:var(--s4) 0 0;font-family:var(--f-cap);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.trago .badge svg{width:30px;height:30px;color:var(--gold)}
.trago .rblk .build{margin-top:0}
.trago .rblk>.steps{margin-top:var(--s2);padding-top:var(--s4);border-top:1px solid var(--line)}
.tarj .ver{margin-top:auto;font-family:var(--f-cap);font-size:.58rem;letter-spacing:.16em;color:var(--gold)}
.tarj .top .ok{font-family:var(--f-cap);font-size:.5rem;letter-spacing:.14em;color:var(--gold)}

.mt{display:block;text-align:center;margin:var(--s5) 0 var(--s3)}
.mas .mt{margin-top:0}
.pills{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center}
.pillw{position:relative;display:inline-flex}
.pill{min-height:44px;display:inline-flex;align-items:center;padding:0 var(--s3);border:1px solid var(--gold-soft);border-radius:999px;font-family:var(--f-name);font-size:1.15rem;background:#fff;color:var(--ink)}
.pill.mas-add{width:44px;padding:0;justify-content:center;color:var(--gold);font-size:1.4rem;border-style:dashed}
.pills.editando .pillw{animation:vibra .28s ease-in-out infinite alternate;touch-action:none}
.pills.editando .pillw:nth-child(2n){animation-delay:-.14s;animation-duration:.31s}
.pills.editando .pillw.arr{animation:none;z-index:3;box-shadow:0 8px 20px rgba(31,38,45,.18);border-radius:999px}
@keyframes vibra{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.pills.editando .pillw.arr{transition:none}

 if(n){let x=BW-14-n*9;for(let i=0;i<n;i++){s+=`<rect x="${x}" y="${y-4}" width="7" height="7" rx="1.5" fill="#fff" stroke="#8aa3ad" stroke-width="1.2" transform="rotate(${i%2?8:-8} ${x+3.5} ${y-.5})"/>`;x+=9}
  s+=`<text x="${BW}" y="${y}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="13" fill="#5f7a85">${n}</text>`;}
 return s;
}
function buildSVG(id,k){
 if(!BUILD[id])return '';
 const b=BUILD[id](k),tool=b.tool==='jug'?'LICUADORA':'COCTELERA';
 const row=(ey,nm,val)=>`<text x="${BNX}" y="${ey}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-size="19" fill="#1f262d">${nm}</text><text x="${BW}" y="${ey}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="12" fill="#8a6a32">${val}</text>`;
 if(b.only){ /* se arma directo en la copa */
  let o=`<text x="0" y="14" font-family="Cinzel,serif" font-size="11" letter-spacing="2.5" fill="#8a6a32">I · EN ${b.gl}</text><text x="${BW}" y="14" text-anchor="end" font-family="Cinzel,serif" font-size="10" letter-spacing="1.5" fill="#a39a8a">${b.unit}</text>`;
  o+=row(48,'Hielo','hasta arriba');
  const c=bBlock(b.g,b.glass,72,.75,b.ice,false,b.cap);o+=c.out;
  let y;
  y=c.end+22;o+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=18;
  o+=`<line x1="64" y1="${y+2}" x2="64" y2="${y+36}" stroke="#8a6a32" stroke-width="1.4"/><path d="M58 ${y+30} L64 ${y+38} L70 ${y+30}" fill="none" stroke="#8a6a32" stroke-width="1.4"/><text font-family="'Instrument Serif',serif" font-style="italic" font-size="16" fill="#6b737a"><tspan x="${BNX}" y="${y+9.5}" dominant-baseline="central">${b.how[0]}</tspan><tspan x="${BNX}" y="${y+28.5}" dominant-baseline="central">${b.how[1]}</tspan></text>`;
  y+=56;o+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=26;
  b.extra.forEach(([nm,val])=>{o+=row(y,nm,val);y+=30});
  return `<section class="build" aria-label="Cómo se arma"><svg viewBox="0 0 ${BW} ${y-8}" role="img" aria-label="Diagrama: capas en la copa">${o}</svg></section>`;
 }
 let out=`<text x="0" y="14" font-family="Cinzel,serif" font-size="11" letter-spacing="2.5" fill="#8a6a32">I · EN LA ${tool}</text><text x="${BW}" y="14" text-anchor="end" font-family="Cinzel,serif" font-size="10" letter-spacing="1.5" fill="#a39a8a">${b.unit||'DEDOS'}</text>`;
 const a=bBlock(b.tool,b.v,30,.65,b.vIce,true,b.cap);out+=a.out;
 const clRow=(ey,nm,val)=>`<text x="${BNX}" y="${ey}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-size="19" fill="#1f262d">${nm}</text><text x="${BW}" y="${ey}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="12" fill="#8a6a32">${val}</text>`;
 if(b.cap){ /* licuadora: hielo y clara arriba, alineados con el borde superior; preparado abajo */
  const rows=[];if(b.vIce)rows.push(y=>iceRow(y,b.vIce));(b.extra||[]).forEach(([nm,val])=>rows.push(y=>clRow(y,nm,val)));
  const y0=a.top+10,yp=a.maxLy-21,st=(yp-y0)/rows.length;
  rows.forEach((f,i)=>{out+=f(y0+st*i)});
  a.end=Math.max(a.end,a.bot+8);
 }else{
 if(b.vIce){const iy=Math.max(a.maxLy+34,a.end-6);out+=iceRow(iy,b.vIce);a.end=iy+16;}
 (b.extra||[]).forEach(([nm,val])=>{const ey=a.end+20;out+=clRow(ey,nm,val);a.end=ey+16;});
 }
 let y=a.end+22;out+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=18;
 out+=`<line x1="64" y1="${y+2}" x2="64" y2="${y+36}" stroke="#8a6a32" stroke-width="1.4"/><path d="M58 ${y+30} L64 ${y+38} L70 ${y+30}" fill="none" stroke="#8a6a32" stroke-width="1.4"/>
  <text font-family="'Instrument Serif',serif" font-style="italic" font-size="16" fill="#6b737a">${b.how[1]?`<tspan x="${BNX}" y="${y+19-9.5}" dominant-baseline="central">${b.how[0]}</tspan><tspan x="${BNX}" y="${y+19+9.5}" dominant-baseline="central">${b.how[1]}</tspan>`:`<tspan x="${BNX}" y="${y+19}" dominant-baseline="central">${b.how[0]}</tspan>`}</text>`;
 y+=56;out+=`<line x1="${BNX-80}" y1="${y}" x2="${BW}" y2="${y}" stroke="#eee9e0"/>`;y+=28;
 out+=`<text x="0" y="${y}" font-family="Cinzel,serif" font-size="11" letter-spacing="2.5" fill="#8a6a32">II · EN ${b.gl||'LA COPA'}</text>`;
 const c=bBlock(b.g,b.glass,y+16,.75,b.ice,true);out+=c.out;
 if(!b.noIce){const iy=c.maxLy+36;out+=iceRow(iy,b.ice);c.end=Math.max(c.end,iy+16);}
 return `<section class="build" aria-label="Cómo se arma"><svg viewBox="0 0 ${BW} ${c.end+6}" role="img" aria-label="Diagrama: ingredientes en la ${tool.toLowerCase()} y capas en el vaso">${out}</svg></section>`;
}

const ozTxt=x=>{const w=Math.floor(x+1e-6),f=+(x-w).toFixed(3);const m={0.25:'¼',0.5:'½',0.75:'¾'};return ((w?w:'')+(m[f]||''))||'0'};
const frac=x=>{const w=Math.floor(x+1e-6),f=x-w;let s='';if(Math.abs(f-1/3)<.05)s='⅓';else if(Math.abs(f-2/3)<.05)s='⅔';return (w?w:'')+(s||(w?'':'0'))};
let multT=1;
const fmtQ=q=>{const w=Math.floor(q),f=q-w,fr=f>.6?'¾':f>.4?'½':f>.2?'¼':'';return (w?w:'')+(fr||(w?'':'0'))};
let varT=0;
function renderPrep(r){
  back.setAttribute('href','#'+r.sec);irCat=r.cat;hLupa('#'+r.id);
  const tot=r.ing.reduce((a,x)=>a+x.ml,0),B=256,HB=190,P='M24 92q0-22 26-30V32h30v30q26 8 26 30v150q0 14-14 14H38q-14 0-14-14z';
  let yb=B,fills='',labs='';
  r.ing.forEach(x=>{const h=x.ml/tot*HB,y=yb-h,m=y+h/2;yb=y;
    fills+=`<rect x="0" y="${y}" width="140" height="${h}" fill="${x.col}"/>`+(y>66?`<line x1="0" x2="140" y1="${y}" y2="${y}" stroke="#1f262d" stroke-width="1" stroke-dasharray="3 2"/>`:'');
    labs+=`<circle cx="104" cy="${m}" r="2" fill="#8a6a32"/><line x1="104" y1="${m}" x2="128" y2="${m}" stroke="#c9b48a" stroke-width=".9"/>
     <text x="136" y="${m-6}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-size="19" fill="#1f262d">${x.n}</text>
     <text x="136" y="${m+14}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-style="italic" font-size="13" fill="#6b737a">${x.sub}</text>
     <text x="300" y="${m+15}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="13" fill="#8a6a32">${x.ml} ml<tspan font-size="10" fill="#a39a8a" dx="5">${x.pct}%</tspan></text>`});
  (r.extra||[]).forEach((x,k)=>{const m=40+k*44;
    labs+=`<circle cx="82" cy="${m}" r="2" fill="#8a6a32"/><line x1="82" y1="${m}" x2="128" y2="${m}" stroke="#c9b48a" stroke-width=".9"/>
     <text x="136" y="${m-6}" dominant-baseline="central" font-family="'Instrument Serif',serif" font-size="19" fill="#1f262d">${x.n}</text>
     <text x="300" y="${m+15}" dominant-baseline="central" text-anchor="end" font-family="Cinzel,serif" font-size="13" fill="#8a6a32">${x.v}</text>`});
  const svg=`<svg viewBox="0 -16 300 290" role="img" aria-label="Botella de ${r.botella}: ${r.ing.map(x=>x.ml+' ml de '+x.n).join(', ')}">
    <text x="0" y="-2" font-family="Cinzel,serif" font-size="11" letter-spacing="2.5" fill="#8a6a32">EN LA BOTELLA</text><text x="300" y="-2" text-anchor="end" font-family="Cinzel,serif" font-size="10" letter-spacing="1.5" fill="#a39a8a">${r.botella.replace('L','LITRO')}</text>
    <defs><clipPath id="pb"><path d="${P}"/></clipPath></defs><g clip-path="url(#pb)">${fills}</g>
    <path d="${P}" fill="none" stroke="#1f262d" stroke-width="2"/><rect x="46" y="18" width="38" height="14" rx="3" fill="#1f262d"/>${labs}</svg>`;
  const para=`<div class="ppara"><span class="cap">Sirve para</span><div class="pl">${r.para.map(n=>{const R=RECETAS[n],f=findT(n);return `<a href="#${R?R.id:f?f.s.id:'carta'}">${n}</a>`}).join('')}</div></div>`;
  app.innerHTML=`<article class="view trago prep" aria-labelledby="dn">
    <div class="hero"><img src="${r.foto}" alt="Botella de ${r.name}"></div>
    <div class="title"><span class="ro">PREPARADO</span><h1 id="dn">${r.name}</h1><p class="psub">Parte del <i lang="fr">mise en place</i>, base para otros tragos</p></div>
    <section class="build pbuild" aria-label="Cómo se prepara">${svg}${r.nota?`<p class="note">${r.nota}</p>`:''}</section>
    ${para}
  </article>`;
}
function renderTrago(r){
  if(r.prep)return renderPrep(r);
  const R0=r;
  back.setAttribute('href','#'+r.sec);irCat=r.cat;
  hLupa('#'+r.id);
  const V=r.variants?r.variants[Math.min(varT,r.variants.length-1)]:null,rr=Object.assign({},r,V&&V.ing?{ing:V.ing,serv:V.serv||r.serv,steps:V.steps||r.steps}:{});
  r=rr;
  const fd=r.fotoDir||'',L=+(new URLSearchParams(location.search).get('l'))||(fd?1:0);
  const ph=(f,lab)=>f?`<span class="ph"><img src="${fd}${f}.jpg?v=7" alt="" loading="lazy"></span>`:`<span class="ph pend">foto<br>pendiente</span>`;
  const rows=r.ing.map(x=>{const q=x.fixed?x.q:x.q*multT;
    const tc=L===1&&fd?`<td class="t">${x.f===undefined?`<span class="ph ico"><svg viewBox="0 0 40 40"><use href="#${x.ico||'hielo'}"/></svg></span>`:ph(x.f)}</td>`:'';
    if(x.oz){const o=x.oz*multT,n=o/DEDO,fl=Math.floor(n+1e-6),pt=n-fl,cnt=Math.min(fl+(pt>.05?1:0),8);let fi='';for(let i=0;i<cnt;i++)fi+=`<i style="--f:${i<fl?100:Math.round(pt*100)}%"></i>`;
      return `<tr>${tc}<td class="n">${x.n}${x.sub?`<small>${x.sub(multT)}</small>`:''}</td><td class="qty">${ozTxt(o)} oz<span class="fing">${fi}<em>${frac(Math.round(n*3)/3)} ${n>1.05?'dedos':'dedo'}</em></span></td></tr>`}
    if(x.t==='?')return `<tr>${tc}<td class="n">${x.n}${x.sub?`<small>${x.sub(multT)}</small>`:''}</td><td class="qty pd">medida<br>pendiente</td></tr>`;
    if(x.t)return `<tr>${tc}<td class="n">${x.n}${x.sub?`<small>${x.sub(multT)}</small>`:''}</td><td class="qty${/\d/.test(x.t)?'':' w'}">${x.t}</td></tr>`;
    return `<tr>${L===1&&fd?`<td class="t">${x.f===undefined?`<span class="ph pend">foto<br>pendiente</span>`:ph(x.f)}</td>`:''}<td class="n">${x.n}${x.sub?`<small>${x.sub(multT)}</small>`:''}</td><td class="qty">${x.pre?`<i class="qx">${x.pre}</i>`:''}${fmtQ(q)}${x.u?' '+x.u:''}${x.post?`<i class="qx">${x.post}</i>`:''}</td></tr>`}).join('');
  app.innerHTML=`<article class="view trago" aria-labelledby="dn">
    <div class="hero"><img src="${r.hero}" alt="${r.name}"${r.heroPos?` style="object-position:${r.heroPos}"`:''}></div>
    <div class="title"><h1 id="dn">${r.name}${r.badge?`<svg class="corona" viewBox="0 0 40 40" role="img" aria-label="Trago popular"><use href="#${r.badge[0]}"/></svg>`:''}</h1></div>
    <div class="facts">${r.facts.map(f=>`<div><span class="cap">${f[0]}</span><b>${f[1]}</b></div>`).join('')}</div>
    ${r.variants?`<div class="vsel" role="group" aria-label="Versión">${r.variants.map((x,k)=>`<button data-v="${k}" aria-pressed="${k===varT}">${x.k}</button>`).join('')}</div>`:''}
    <section class="rblk" aria-labelledby="rh"><h2 class="rhead" id="rh">Receta</h2>
      ${!r.ing.length?`<div class="pendr"><span class="cap">Receta por cargar</span><p>Estamos armando esta receta con la barra.</p></div></section>`:''}
      ${r.ing.length?`<div class="recipe">
        <div class="rtop sut"><span class="cap">${multT} ${multT>1?'tragos':'trago'}</span><div class="mult" role="group" aria-label="Cantidad">${[1,2,4].map(m=>`<button data-m="${m}" aria-pressed="${m===multT}">×${m}</button>`).join('')}</div></div>
        ${L===2&&fd?`<div class="mise">${[['copa','Copa'],...r.ing.filter(x=>x.fn).map(x=>[x.f,x.fn]),['cuchara','Cuchara larga']].map(([f,n])=>`<figure>${ph(f)}<figcaption>${n}</figcaption></figure>`).join('')}</div>`:''}
        <div class="serv${L===1&&fd?' cf':''}"${L===2&&fd?' hidden':''}>${r.serv.map(x=>`<div>${L===1&&fd&&x[3]?ph(x[3]):`<svg viewBox="0 0 40 40" aria-hidden="true"><use href="#${x[0]}"/></svg>`}<span>${x[1]}</span></div>`).join('')}</div>
        <table class="ing${L===1&&fd?' cf':''}"><colgroup>${L===1&&fd?'<col class="c-t">':''}<col class="c-n"><col class="c-q"></colgroup><tbody>${rows}</tbody></table>
      </div></section>
    `:''}${r.ing.length?`    <section class="rblk" aria-labelledby="ph"><h2 class="rhead" id="ph">Pasos</h2>
      ${buildSVG(r.id)}
      <ol class="steps${L===3&&fd?' cf':''}">${r.steps.map(x=>{const[t,fs]=Array.isArray(x)?x:[x,[]];return `<li><span>${t}</span>${L===3&&fd?(fs.length>1?`<span class="dos">${fs.map(f=>ph(f)).join('')}</span>`:ph(fs[0])):''}</li>`}).join('')}</ol>
    </section>`:''}
  </article>`;
  app.querySelectorAll('.vsel button').forEach(b=>b.addEventListener('click',()=>{varT=+b.dataset.v;const y=scrollY;renderTrago(R0);scrollTo(0,y)}));
  app.querySelectorAll('.mult button').forEach(b=>b.addEventListener('click',()=>{multT=+b.dataset.m;const y=scrollY;renderTrago(R0);scrollTo(0,y);app.querySelector(`.mult button[data-m="${multT}"]`).focus()}));
}
let abrirBusq=false,volverA=null,desdeMenu=false;
function route(){
  const h=location.hash.slice(1);
  document.getElementById('hRight').innerHTML='';
  if(h!=='carta')volverA=null;
  if(!h){portada.hidden=false;interior.hidden=true;document.title='Rivoli · Carta';return}
  portada.hidden=true;interior.hidden=false;
  const s=SECCIONES.find(x=>x.id===h);
  if(s){cat=irCat??irVolverCat??0;irCat=null;irVolverCat=null;renderSeccion(s);document.title='Rivoli · '+s.n}else if(REC_ID[h]){multT=1;varT=0;renderTrago(REC_ID[h]);document.title='Rivoli · '+REC_ID[h].name}else{irCat=null;renderCarta();document.title='Rivoli · Recetario'}
  if(desdeMenu&&(s||REC_ID[h]))back.setAttribute('href','#carta');
  desdeMenu=false;
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
})();
</script>
