<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3c99b">
<title>Rivoli · Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: portada ilustrada a pantalla completa → índice en arcos → sección con categorías deslizables. Fondo blanco, un solo tema claro. */
:root{
  --bg:#ffffff; --ink:#1f262d; --muted:#6b737a; --gold:#8a6a32; --gold-soft:#c9b48a;
  --line:#e7e4de; --tint:#faf7f1; --sand:#e7cf9f;
  --f-name:"Instrument Serif","Times New Roman",serif;
  --f-cap:"Cinzel","Trajan Pro",serif;
  --f-body:"Cormorant Garamond",Garamond,Georgia,serif;
  --r:.5rem; color-scheme:light;
  /* Escala de espacios (8 pt): s1 4 · s2 8 · s3 16 · s4 24 · s5 32 · s6 48. --m = margen lateral */
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--m:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Portada ---------- */
#portada{position:fixed;inset:0;background:#e9d8b4 url("../assets/ilustraciones/aestas-real.jpg") center/cover no-repeat}
#portada::before{content:"";position:absolute;inset:0 0 auto 0;height:calc(150px + env(safe-area-inset-top,0px));background:linear-gradient(to bottom,var(--sand) 45%,rgba(227,201,155,0))}
#portada .logo{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--s5) + env(safe-area-inset-top,0px));height:64px;width:auto;z-index:1}
#portada .ctas{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(56px + env(safe-area-inset-bottom,0px));
  display:flex;gap:var(--s2);align-items:stretch;z-index:1}
#portada .cta{width:160px;height:44px;display:grid;place-items:center;font-family:var(--f-name);font-size:24px;letter-spacing:.02em;
  background:var(--ink);color:#f6f2ea;border-radius:6px;box-shadow:0 0 0 1px #c9a96e inset, 0 6px 18px rgba(31,38,45,.25);transition:transform .2s}
#portada .tres{height:44px;padding:0 12px 0 var(--s2);display:flex;align-items:center;gap:var(--s2);background:#fff;color:var(--ink);border-radius:6px;
  box-shadow:0 0 0 1px #c9a96e inset, 0 6px 18px rgba(31,38,45,.25);transition:transform .2s;white-space:nowrap}
#portada .tres .n3{font-family:var(--f-name);font-size:44px;line-height:.72;color:var(--gold);padding-top:2px}
#portada .tres .tx{font-family:var(--f-name);font-size:12px;line-height:1.02;letter-spacing:.01em}
#portada .cta:active,#portada .tres:active{transform:scale(.97)}

/* ---------- Vistas interiores ---------- */
.shell{max-width:480px;margin-inline:auto;min-height:100%;
  padding-left:max(var(--m),env(safe-area-inset-left,0px));padding-right:max(var(--m),env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:64px;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid #eee9e0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header .back{font-family:var(--f-name);font-size:2rem;color:var(--gold);display:grid;place-items:center;min-height:44px}
header .home{display:grid;place-items:center}
header .home img{height:40px;width:auto}
main{padding-block:var(--s4) var(--s6)}
.view{animation:rise .4s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cap{font-family:var(--f-cap);font-size:.68rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.h{font-family:var(--f-name);font-weight:400;font-size:2.6rem;line-height:1;margin:0}
.intro{text-align:center;display:grid;gap:var(--s2);margin-bottom:var(--s3)}
.intro .icono{width:22px;height:auto;justify-self:center;margin:0}
.buscar{display:grid;justify-items:center;margin:0 0 var(--s3)}
.lupa{width:44px;height:44px;display:grid;place-items:center;color:var(--gold);transition:opacity .2s}
.lupa svg{width:24px;height:24px}
.lupa[aria-expanded="true"]{opacity:.55}
.caja{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s}
.caja.on{max-height:72px;opacity:1;margin-top:var(--s2)}
.caja label{display:flex;align-items:center;gap:var(--s2);border-bottom:1px solid var(--gold);padding:var(--s2) var(--s1)}
.caja svg{width:16px;height:16px;color:var(--gold);flex:none}
.caja input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--f-name);font-size:1.35rem;color:var(--ink);padding:0}
.caja input::placeholder{color:#b8bcc0}
.caja input::-webkit-search-cancel-button,.caja input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.caja .x{font-size:1.3rem;color:#a39a8a;width:44px;height:44px;margin:-10px -12px -10px 0;display:grid;place-items:center}
.row mark{background:linear-gradient(transparent 58%,#f1e3c4 58%);color:inherit}
.row .cat{font-family:var(--f-cap);font-size:.58rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:var(--s1)}
.cats.dim{opacity:.35}
.nada{text-align:center;color:#8a8f94;font-style:italic;padding:var(--s4) 0}
.intro p{margin:.6rem auto 0;font-size:1.05rem;color:#58616a;max-width:39ch;line-height:1.4}

/* buscador del recetario */
.bhero{position:relative;display:grid;justify-items:center;gap:var(--s3);text-align:center;padding:var(--s4) 0 0;margin-bottom:var(--s5)}
.bhero .marco{display:grid;grid-template-columns:38px minmax(0,auto) 38px;align-items:center;gap:var(--s3);justify-content:center}
.bhero .laurel{width:38px;height:104px;color:var(--gold);opacity:.75;pointer-events:none}
.bhero .laurel.r{transform:scaleX(-1)}
.bhero .q{font-family:var(--f-name);font-weight:400;font-size:2rem;line-height:1.05;margin:0;max-width:15ch;text-wrap:balance}
.bzona{justify-self:stretch;display:grid;justify-items:center;min-height:56px;align-items:center}
.blupa{width:48px;height:48px;display:grid;place-items:center;color:var(--gold);transition:opacity .2s,transform .3s}
.blupa svg{width:30px;height:30px}
.blupa:active{transform:scale(.92)}
.bcaja{grid-area:1/1;width:44px;height:56px;opacity:0;pointer-events:none;border:1px solid var(--gold);border-radius:999px;background:#fff;box-shadow:0 6px 22px rgba(138,106,50,.16);
  transition:width .45s cubic-bezier(.3,.7,.2,1),opacity .25s;display:flex;align-items:center;padding:0 var(--s4);overflow:hidden}
.bzona .blupa{grid-area:1/1}
.bcaja input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--f-name);font-size:1.45rem;color:var(--ink);padding:0;caret-color:var(--gold)}
.bcaja input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.buscando .bcaja{width:100%;opacity:1;pointer-events:auto}
.buscando .blupa{opacity:0;pointer-events:none}
.rec{transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .22s ease-out;will-change:transform}
.buscando .rec{transform:translateY(45vh);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s ease}
.rec.arrastre{transition:none!important}
.rec.fuera{display:none}
.buscando .bhero{margin-bottom:var(--s3)}
#bres{display:none}
.buscando #bres{display:block;padding-bottom:96px}
#bres .row{color:inherit}
.bvolver{position:fixed;left:50%;bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;display:grid;justify-items:center;gap:var(--s1);
  font-family:var(--f-cap);font-size:.6rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;background:rgba(255,255,255,.92);padding:var(--s2) var(--s3);border-radius:999px;transition:opacity .3s,transform .3s;z-index:15;min-height:44px}
.bvolver::before{content:"";width:10px;height:10px;border-left:1.5px solid var(--gold);border-top:1.5px solid var(--gold);transform:rotate(45deg);animation:sube 1.6s ease-in-out infinite}
@keyframes sube{50%{transform:translateY(-4px) rotate(45deg)}}
.buscando .bvolver{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* arcos */
.arches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s3)}
.arch{display:grid;justify-items:center;align-content:start;text-align:center;gap:var(--s1);min-width:0}
.arch .aw{box-sizing:border-box;display:block}
.arch .aw{width:100%;height:216px;border-radius:999px 999px 6px 6px;overflow:hidden;border:1px solid #c9b48a;padding:var(--s1);background:#fff;transition:border-color .2s,transform .2s}
.arch .aw img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:999px 999px 4px 4px;display:block}
.arch:active .aw,.arch:hover .aw{border-color:var(--gold);transform:translateY(-2px)}
.arch .n{font-family:var(--f-name);font-size:1.38rem;line-height:1;margin-top:var(--s1)}
.arch .d{font-size:.86rem;color:#6b737a;line-height:1.2}
.arch.solo{grid-column:1 / -1;width:calc(50% - var(--s2));justify-self:center;position:relative}
.arch.solo::before,.arch.solo::after{content:"";position:absolute;top:66px;width:83px;height:135px;background:url(../assets/logo/rama.png) center/contain no-repeat;opacity:.55;pointer-events:none}
.arch.solo::before{right:calc(100% + var(--s2));transform:rotate(-18deg) scaleX(-1)}
.arch.solo::after{left:calc(100% + var(--s2));transform:rotate(18deg)}
.arch.grande{grid-column:1 / -1;width:75%;justify-self:center;margin-top:var(--s2)}
.arch.grande .aw{height:232px}
.arch.grande .n{font-size:1.75rem}
.arch.grande .d{font-size:.95rem;max-width:30ch}
.arch.falta .aw{border-style:dashed}.arch.falta .aw img{filter:grayscale(1) opacity(.35)}

/* categorías deslizables */
.rowwrap{position:relative;margin:0 calc(-1 * max(var(--m),env(safe-area-inset-left,0px))) 0}
.cats{display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:0;scrollbar-width:none;border-bottom:1px solid #eee9e0}
.cats::-webkit-scrollbar{display:none}
.cats button{scroll-snap-align:center;flex:0 0 33.3333%;min-width:0;display:grid;justify-items:center;gap:var(--s1);padding:var(--s1) var(--s1) var(--s2);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:border-color .2s}
.cats button .r{font-family:var(--f-cap);font-size:.66rem;letter-spacing:.2em;color:#c9b48a;line-height:1}
.cats button .t{font-family:var(--f-name);font-size:clamp(1.15rem,5.6vw,1.45rem);line-height:1;color:#a3a7ab;transition:color .2s;white-space:nowrap}
.cats button[aria-selected="true"]{border-bottom-color:var(--gold)}
.cats button[aria-selected="true"] .t{color:var(--ink)}
.cats button[aria-selected="true"] .r{color:var(--gold)}
.fade{position:absolute;right:0;top:0;bottom:1px;width:40px;background:linear-gradient(to right,rgba(255,255,255,0),#fff);pointer-events:none}
.fade.l{right:auto;left:0;background:linear-gradient(to left,rgba(255,255,255,0),#fff)}
.sub{border-left:2px solid var(--gold-soft);padding-left:10px;margin:1.08rem 0 .48rem}
.sub .n{font-family:var(--f-name);font-size:1.5rem;line-height:1.1}
.sub .d{font-style:italic;color:#58616a;font-size:1rem}
.list{animation:rise .3s ease;margin-top:var(--s2)}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dotted var(--line);padding:var(--s3) 0;gap:var(--s3)}
.row .n{font-family:var(--f-name);font-size:1.3rem;line-height:1.1}
.row small{display:block;font-family:var(--f-body);font-size:.95rem;color:#8a8f94;margin-top:var(--s1)}
.row .go{font-family:var(--f-name);color:var(--gold);font-size:1.4rem}
.pend{font-family:var(--f-cap);font-size:.6rem;letter-spacing:.14em;color:#a39a8a;white-space:nowrap}
.empty{border:1px dashed #e2d6bd;border-radius:var(--r);padding:var(--s4) var(--s3);text-align:center;color:#6b737a;font-style:italic}
.hint{font-size:.85rem;color:#a39a8a;text-align:center;font-style:italic;margin-top:var(--s3)}
</style>
</head>
<body>

  <img class="logo" src="../assets/logo/rivoli-oscuro.png" alt="Rivoli">
  <div class="ctas">

<div class="shell" id="interior" hidden>

</div>

<script>
(function(){

   ['Clásicos','Cócteles de siempre, cortos y potentes.',[['Martini Dry','Gin · vermouth dry'],['Manhattan','Bourbon · vermouth rosso'],['Clavo Oxidado','Whisky · Drambuie'],['French 75','Gin · limón · prosecco'],['Espresso Martini Rivoli','Vodka · espresso · licor de naranja'],['Bloody Mary','Vodka · tomate · limón · especias'],['Bellini','Conserva de durazno · prosecco'],['Venni Julet Rivoli','Vino tinto · St-Germain · vodka · ginger beer'],['Vaina','Oporto · cognac · yema · cacao · canela'],['Carajillo','Café · Licor 43']]],
   ['Margaritas','Tequila con cítricos.',[['Tequila Margarita','Tequila · limón · licor de naranja'],['Saint Germain Margarita','St-Germain · tequila · limón'],['Aperol Coconut Margarita','Tequila · Aperol · limón · coco']]],
   ['Sangrías','Para compartir, en copa o jarra.',[['Copa Sangría Vino Tinto','Vino tinto · frutas · azúcar · pisco'],['Copa Sangría Vino Blanco','Vino blanco · frutas · goma · maracuyá · pisco'],['Jarra Sangría Vino Tinto','Para la mesa'],['Jarra Sangría Vino Blanco','Para la mesa']]],
   ['Piscos','Solos o con bebida.',[['Alto del Carmen','Solo o con bebida'],['Pisco Republicano 40','Solo o con bebida']]]
  ]},
 {id:'mocktails',n:'Mocktails',i:'cero',d:'Sin alcohol, frutales y frescos.',
  intro:'Tragos sin alcohol para quien no bebe o maneja. Frutales, frescos y con la misma presentación que un cóctel.',
  cats:[
   ['Spritz 0°','Burbujeantes, sin alcohol.',[['Bellini sin alcohol','Durazno · goma · espumante sin alcohol'],['Copa Spritz sin alcohol','Espumante rosé sin alcohol · fruta · limón']]],
   ['Mojitos 0°','Menta, lima y soda.',[['Mojito Tradicional sin alcohol','Lima · azúcar · menta · soda'],['Mojito de Berries','Berries · menta · lima'],['Caipirina sin alcohol','Tónica · mandarina · limón · goma']]],
   ['Hibisco','Florales y frutales.',[['Fiore di Hibisco','Flor de hibisco · naranja · miel · lima · tónica'],['Dolce Rosso','Hibisco · maracuyá · limón · naranja · miel']]],
   ['Sangría 0°','Para compartir.',[['Copa Sangría sin alcohol','Vino sin alcohol · frutas · maracuyá · limón']]]
  ]},
 {id:'birre',n:'Birre',i:'birra',d:'Cervezas para pizzas y antipasti.',intro:'Cervezas para acompañar pizzas, antipasti y la terraza.',cats:[]},
 {id:'jugos',n:'Jugos y aguas',i:'alto',d:'Jugos naturales y aguas para la mesa.',intro:'Jugos naturales, bebidas y aguas para la mesa.',cats:[]},
 {id:'digestivi',n:'Digestivi',i:'digest',d:'Licores y amari para cerrar.',intro:'Licores y amari italianos para cerrar la comida.',cats:[]},
 {id:'vinos',n:'Vinos',i:'vino',d:'Tintos, blancos y espumantes.',intro:'Tintos, blancos y espumantes chilenos e italianos para maridar.',cats:[]},
 {id:'caffe',n:'Caffè',i:'cafe',d:'Espresso y cafés para el final.',intro:'Espresso y cafés a la italiana, para el final.',cats:[],cls:'solo'},
 {id:'bases',n:'Preparaciones de barra',i:'alto',d:'Las bases que preparamos para armar los tragos: limonada, jamaicano, jengibre, maracuyá y más.',intro:'Recetas de las preparaciones que se hacen en la barra y se usan como base de otros tragos.',cats:[],cls:'grande'}
];
const count=s=>s.cats.reduce((a,c)=>a+c[2].length,0);

const portada=document.getElementById('portada'),interior=document.getElementById('interior'),app=document.getElementById('app'),back=document.getElementById('back');
let cat=0;

const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const IMG_LISTA=['aperitivi','mocktails','birre','jugos','digestivi','vinos','caffe','bases'];
const IMG_POS={mocktails:'100%',jugos:'100%',digestivi:'100%',caffe:'35%',bases:'80%'};
function renderCarta(){
  back.setAttribute('href','#');
  app.innerHTML=`<div class="view" id="vrec"><section class="bhero" aria-label="Buscar un trago"><span class="cap">Buscador</span><div class="marco"><svg class="laurel l" aria-hidden="true"><use href="#i-laurel"/></svg><h2 class="q">¿Qué tragos quieres realizar?</h2><svg class="laurel r" aria-hidden="true"><use href="#i-laurel"/></svg></div>
   <div class="bzona"><div class="bcaja"><input id="bq" type="search" autocomplete="off" enterkeyhint="search" aria-label="Nombre del trago" tabindex="-1"></div><button class="blupa" id="blupa" aria-label="Buscar un trago">${ic('i-lupa')}</button></div></section>
   <div id="bres" aria-live="polite"></div>
   <div class="rec"><div class="intro" style="margin-bottom:var(--s4)"><h1 class="h">Recetario</h1></div>
   <nav class="arches" aria-label="Secciones de la carta">
   ${SECCIONES.map(s=>{const ok=IMG_LISTA.includes(s.id);return `<a class="arch${s.cls?' '+s.cls:''}${ok?'':' falta'}" href="#${s.id}"><span class="aw"><img src="../assets/carta/${s.id}${ok?'':'-prov'}.jpg" alt="" loading="lazy"${IMG_POS[s.id]?` style="object-position:center ${IMG_POS[s.id]}"`:''}></span><span class="n">${s.n}</span><span class="d">${s.d}</span></a>`}).join('')}
   </nav></div><button class="bvolver" id="bvolver">Ver recetario</button></div>`;
  buscadorGlobal();
}
let irCat=null;
function buscadorGlobal(){
  const v=document.getElementById('vrec'),q=document.getElementById('bq'),res=document.getElementById('bres');
  const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const marca=(t,k)=>{const i=norm(t).indexOf(k);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+k.length))+'</mark>'+esc(t.slice(i+k.length))};
  const rec=v.querySelector('.rec');let tOculta=null;
  /* el recetario baja animado y luego se saca del flujo, para que la página no quede con alto vacío */
  const abrir=()=>{if(v.classList.contains('buscando'))return;v.classList.add('buscando');q.tabIndex=0;scrollTo({top:0,behavior:'smooth'});pintar();
    clearTimeout(tOculta);tOculta=setTimeout(()=>{if(v.classList.contains('buscando'))rec.classList.add('fuera')},560)};
  const cerrar=()=>{if(!v.classList.contains('buscando'))return;clearTimeout(tOculta);rec.classList.remove('fuera');void rec.offsetHeight;v.classList.remove('buscando');q.tabIndex=-1;q.value='';q.blur();res.innerHTML=''};
  const pintar=()=>{const k=norm(q.value.trim());
    if(!k){res.innerHTML='';return}
    const r=[];SECCIONES.forEach(s=>s.cats.forEach((c,ci)=>c[2].forEach(d=>{if(norm(d[0]).includes(k))r.push([s,ci,c[0],d])})));
    res.innerHTML=r.length?`<div class="list">${r.map(([s,ci,cn,d])=>`<a class="row" href="#${s.id}" data-c="${ci}"><div><span class="cat">${s.n} · ${cn}</span><span class="n">${marca(d[0],k)}</span><small>${d[1]}</small></div><span class="go">›</span></a>`).join('')}</div>`:`<p class="nada">No encontramos “${esc(q.value.trim())}”</p>`};
  q.addEventListener('input',pintar);
  document.getElementById('blupa').addEventListener('click',()=>{abrir();q.focus()});
  document.getElementById('bvolver').addEventListener('click',cerrar);
  /* tocar fuera de la caja (y fuera de un resultado) cierra el buscador y vuelve al inicio del recetario */
  document.addEventListener('click',e=>{if(!v.isConnected||!v.classList.contains('buscando'))return;
    if(conTexto()||e.target.closest('.bcaja,#blupa,a[data-c],header'))return;cerrar();scrollTo({top:0,behavior:'smooth'})});
  res.addEventListener('click',e=>{const a=e.target.closest('a[data-c]');if(a)irCat=+a.dataset.c});
  let y0=null;
  /* deslizar el dedo hacia arriba, cuando ya no queda lista por recorrer, trae el recetario desde abajo */
  const alFondo=()=>innerHeight+scrollY>=document.documentElement.scrollHeight-4;
  const conTexto=()=>q.value.trim()!=='';  /* con algo escrito, los resultados se quedan: no vuelve el recetario */
  /* el recetario sigue al dedo mientras se desliza; al soltar termina de subir o vuelve a esconderse */
  let tira=false,dy=0;
  const H=()=>innerHeight*.45;
  const pinta=d=>{const k=Math.min(d/H(),1);rec.style.transform=`translateY(${(1-k)*H()}px)`;rec.style.opacity=Math.min(1,k*1.6)};
  document.addEventListener('touchstart',e=>{tira=false;dy=0;y0=v.isConnected&&v.classList.contains('buscando')&&!conTexto()?e.touches[0].clientY:null},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0===null)return;
    if(!tira){if(!alFondo())return;y0=e.touches[0].clientY;tira=true;clearTimeout(tOculta);rec.classList.remove('fuera');rec.classList.add('arrastre');q.blur();return}
    dy=Math.max(0,(y0-e.touches[0].clientY)*1.4);pinta(dy)},{passive:true});
  const suelta=()=>{if(!tira){y0=null;return}tira=false;y0=null;rec.classList.remove('arrastre');void rec.offsetHeight;
    if(dy>36){cerrar();void rec.offsetHeight;rec.style.transform='';rec.style.opacity=''}
    else{rec.style.transform='';rec.style.opacity='';tOculta=setTimeout(()=>{if(v.classList.contains('buscando'))rec.classList.add('fuera')},460)}};
  document.addEventListener('touchend',suelta,{passive:true});document.addEventListener('touchcancel',suelta,{passive:true});
  addEventListener('wheel',e=>{if(v.isConnected&&v.classList.contains('buscando')&&e.deltaY>30&&!conTexto()&&alFondo())cerrar()},{passive:true});
}
function renderSeccion(s){
  back.setAttribute('href','#carta');
  const n=count(s);
  app.innerHTML=`<div class="view"><div class="intro"><span class="cap">La carta${n?' · '+n+' tragos':''}</span>${s.icono?`<img class="icono" src="../assets/iconos/${s.icono}.png" alt="">`:''}<h1 class="h">${s.n}</h1></div>
   ${s.cats.length?`<div class="buscar"><button class="lupa" id="lupa" aria-label="Buscar un trago" aria-expanded="false" aria-controls="caja">${ic("i-lupa")}</button><div class="caja" id="caja"><label>${ic("i-lupa")}<input id="q" type="search" placeholder="Nombre del trago" autocomplete="off" enterkeyhint="search" aria-label="Nombre del trago"><button class="x" id="qx" aria-label="Borrar búsqueda" hidden>×</button></label></div></div>`:''}
   ${s.cats.length?`<div class="rowwrap"><div class="cats" id="cats" role="tablist" aria-label="Categorías">${s.cats.map((c,i)=>`<button role="tab" data-i="${i}" aria-selected="${i===cat}" aria-label="${c[0]}, ${c[2].length} tragos"><span class="r">${ROM[i]}</span><span class="t">${c[0]}</span></button>`).join('')}</div><div class="fade"></div><div class="fade l"></div></div>
   <div id="lista"></div><p class="hint">Desliza las categorías hacia el lado</p>`
   :`<div class="empty">Aún no cargamos el detalle de esta sección.</div>`}</div>`;
  if(!s.cats.length)return;
  const cats=document.getElementById('cats');
  const show=i=>{cat=i;const c=s.cats[i];
    cats.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
    q.value='';qx.hidden=true;cats.classList.remove('dim');
    document.getElementById('lista').innerHTML=`<div class="list">${c[2].map(r=>`<div class="row"><div><span class="n">${r[0]}</span><small>${r[1]}</small></div><span class="pend">receta pendiente</span></div>`).join('')}</div>`;
    cats.querySelector(`[data-i="${i}"]`).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  };
  cats.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)});
  /* buscador */
  const lupa=document.getElementById('lupa'),caja=document.getElementById('caja'),q=document.getElementById('q'),qx=document.getElementById('qx');
  const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const marca=(t,k)=>{const i=norm(t).indexOf(k);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+k.length))+'</mark>'+esc(t.slice(i+k.length))};
  const buscar=()=>{const k=norm(q.value.trim());qx.hidden=!q.value;
    if(!k){cats.classList.remove('dim');show(cat);return}
    cats.classList.add('dim');
    const r=[];s.cats.forEach((c,i)=>c[2].forEach(d=>{if(norm(d[0]).includes(k))r.push([d,c[0]])}));
    document.getElementById('lista').innerHTML=r.length?`<div class="list">${r.map(([d,cn])=>`<div class="row"><div><span class="cat">${cn}</span><span class="n">${marca(d[0],k)}</span><small>${d[1]}</small></div><span class="pend">receta pendiente</span></div>`).join('')}</div>`:`<p class="nada">No encontramos “${esc(q.value.trim())}”</p>`};
  lupa.addEventListener('click',()=>{const on=!caja.classList.contains('on');caja.classList.toggle('on',on);lupa.setAttribute('aria-expanded',on);
    if(on)setTimeout(()=>q.focus(),60);else{q.value='';buscar()}});
  q.addEventListener('input',buscar);
  qx.addEventListener('click',()=>{q.value='';buscar();q.focus()});
  let x0=null,y0=null;const lista=document.getElementById('lista');
  lista.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  lista.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show((cat+(dx<0?1:-1)+s.cats.length)%s.cats.length);x0=null},{passive:true});
  show(cat);
}
function route(){
  const h=location.hash.slice(1);
  if(!h){portada.hidden=false;interior.hidden=true;document.title='Rivoli · Carta';return}
  portada.hidden=true;interior.hidden=false;
  const s=SECCIONES.find(x=>x.id===h);
  if(s){cat=irCat??0;irCat=null;renderSeccion(s);document.title='Rivoli · '+s.n}else{renderCarta();document.title='Rivoli · Recetario'}
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
